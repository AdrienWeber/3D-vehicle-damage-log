<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van damage log</title>
<meta name="description" content="Mark and document vehicle damage on an interactive 3D model.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAEE; --stage:#EEF1F4; --surface:#FFFFFF; --surface-2:#F3F5F7;
  --ink:#16222C; --ink-2:#5A6874; --line:#D2D9DF; --grid:#C3CCD4;
  --accent:#0D5C63; --accent-ink:#FFFFFF;
  --minor:#C98F00; --moderate:#E0621F; --severe:#C3212B; --done:#8A949C; --ok:#2F7D4A;
  --scrim:rgba(12,22,30,.5);
  --body:"Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --cond:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181E; --stage:#161F26; --surface:#1B252D; --surface-2:#222E37;
    --ink:#E4EAEF; --ink-2:#98A6B2; --line:#2D3A45; --grid:#2E3C47;
    --accent:#44A9B0; --accent-ink:#081A1C; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181E; --stage:#161F26; --surface:#1B252D; --surface-2:#222E37;
  --ink:#E4EAEF; --ink-2:#98A6B2; --line:#2D3A45; --grid:#2E3C47;
  --accent:#44A9B0; --accent-ink:#081A1C; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{font-family:var(--cond);font-weight:700;margin:0;letter-spacing:.005em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100%}
.stage{position:relative;background:var(--stage);overflow:hidden;min-height:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage.marking canvas{cursor:crosshair}

.stage-head{position:absolute;top:18px;left:20px;right:20px;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stage-head h1{font-size:28px;line-height:1.1}
.plate{display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:5px;background:#fff;color:#111;font:700 20px/1 var(--cond);letter-spacing:.06em;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.plate .eu{background:#1D3F9A;color:#fff;font-size:11px;letter-spacing:0;display:flex;align-items:flex-end;justify-content:center;padding:0 5px 4px;min-width:20px}
.plate .txt{padding:5px 10px 4px}
.plate-empty{font-size:14px;color:var(--ink-2)}

.hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500;pointer-events:none;max-width:min(90%,340px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.stage.marking .hint{top:78px;transform:translateX(-50%)}

.dock{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.dock>*{pointer-events:auto}
.views{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.views button{border:0;background:none;padding:7px 11px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.views button:hover{color:var(--ink);background:var(--surface-2)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:12px 20px;font-size:16px;font-weight:600;border-radius:11px}
.btn.cancel-mark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--severe);border-color:transparent;background:none;padding-left:4px}
#resetDemo.armed{background:var(--severe);color:#fff;border-color:var(--severe)}
.btn.danger.armed{background:var(--severe);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.plus{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;position:relative}
.plus::before,.plus::after{content:"";position:absolute;background:currentColor;left:50%;top:50%;transform:translate(-50%,-50%)}
.plus::before{width:8px;height:2px}.plus::after{width:2px;height:8px}

.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);pointer-events:none}

.panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel section{padding:18px 20px}
.panel h2{font-size:19px}
.vehicle{border-bottom:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.fields .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
label.f input,label.f select,label.f textarea{font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
label.f textarea{resize:vertical;min-height:72px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}

.damages{flex:1;overflow:auto;min-height:0}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.filter{display:flex;gap:4px}
.filter button{border:1px solid transparent;background:none;padding:4px 9px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:500}
.filter button[aria-pressed="true"]{border-color:var(--line);background:var(--surface-2);color:var(--ink)}
#list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{border-radius:10px;border:1px solid transparent}
.item.sel{border-color:var(--line);background:var(--surface-2)}
.item-main{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:10px;cursor:pointer;border-radius:10px}
.item-main:hover{background:var(--surface-2)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font:700 15px/28px var(--cond);text-align:center;box-shadow:0 0 0 2px var(--surface)}
.item.repaired .num{background:var(--done)}
.item-body{display:flex;flex-direction:column;min-width:0;flex:1}
.zone{font-weight:600}
.meta{font-size:13.5px;color:var(--ink-2)}
.meta .st-done{color:var(--ok);font-weight:500}
.note{font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.item-extra{padding:0 10px 12px 50px;display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.empty{color:var(--ink-2);padding:12px 2px;max-width:34ch}

.model-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.model-label{font-size:13.5px;color:var(--ink-2);flex:1 1 100%}
.btn.small{padding:6px 11px;font-size:14px}
#modelUpload{position:relative}
#modelUpload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.panel-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{margin:0 0 0 auto;font-size:13px;color:var(--ink-2)}

.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:14px;width:min(540px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.sev{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
fieldset.sev legend{font-size:13px;color:var(--ink-2);font-weight:500;padding:0;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px}
.seg label::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.seg input:checked+label{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.photo-row{display:flex;flex-direction:column;gap:8px}
.photo-row .lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.photo-row .thumbs .t{position:relative}
.photo-row .thumbs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-size:14px;line-height:22px;padding:0}
.addphoto{align-self:flex-start;position:relative}
.addphoto input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.photo-note{font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:8px;align-items:center;margin-top:4px}
.actions .spacer{flex:1}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:20;padding:20px;cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:500;z-index:30;max-width:90%;text-align:center}
.toast[hidden]{display:none}

@media (max-width: 860px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:62vh;min-height:360px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .damages{overflow:visible}
  .stage-head h1{font-size:23px}
  .dock{left:10px;right:10px;bottom:10px}
  .views button{padding:6px 8px;font-size:14px}
  .modal{place-items:end center;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
@media (max-width: 420px){ .row2,.fields{grid-template-columns:1fr} }
@media print{ .dock,.panel-foot,.hint{display:none} }
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage" aria-label="3D view of the van">
    <div class="stage-head">
      <h1 id="hModel">Transporter</h1>
      <div id="hPlate"></div>
    </div>
    <div class="loading" id="loading">Loading the 3D view…</div>
    <div class="hint" id="modelBusy" hidden></div>
    <div class="hint" id="hint" hidden>Click the spot on the van where the damage is. Esc cancels.</div>
    <div class="dock">
      <div class="views" role="group" aria-label="Camera view">
        <button data-view="iso">3/4</button><button data-view="front">Front</button><button data-view="rear">Rear</button><button data-view="left">Left</button><button data-view="right">Right</button><button data-view="top">Top</button>
      </div>
      <button class="btn primary big" id="markBtn"><span class="plus" aria-hidden="true"></span><span>Mark damage</span></button>
    </div>
  </main>

  <aside class="panel">
    <section class="vehicle">
      <h2>Vehicle</h2>
      <div class="fields">
        <label class="f wide">Model<input id="vModel" autocomplete="off"></label>
        <label class="f">Number plate<input id="vPlate" placeholder="DD-AB 1234" autocomplete="off"></label>
        <label class="f">Mileage (km)<input id="vMileage" inputmode="numeric" autocomplete="off"></label>
        <label class="f wide">VIN<input id="vVin" autocomplete="off" spellcheck="false"></label>
      </div>
      <div class="model-row">
        <span class="model-label" id="modelLabel">3D model: schematic van</span>
        <label class="btn small" id="modelUpload" hidden>Upload model (.glb)<input type="file" id="modelFile" accept=".glb,model/gltf-binary"></label>
        <button class="btn small" id="modelReset" hidden>Use schematic</button>
      </div>
    </section>
    <section class="damages">
      <div class="list-head">
        <h2>Damages</h2>
        <div class="filter" role="group" aria-label="Filter damages">
          <button data-f="all" aria-pressed="true">All</button><button data-f="open" aria-pressed="false">Open</button><button data-f="repaired" aria-pressed="false">Repaired</button>
        </div>
      </div>
      <ol id="list"></ol>
      <p class="empty" id="empty">No damages logged yet. Press Mark damage, then click the spot on the van.</p>
    </section>
    <footer class="panel-foot">
      <button class="btn" id="exportReport">Download report</button>
      <button class="btn" id="exportCsv">CSV</button>
      <button class="btn" id="resetDemo">Reset demo</button>
      <p class="sync" id="sync">Connecting…</p>
    </footer>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">New damage</h2>
    <label class="f">Location<input id="fZone" autocomplete="off"></label>
    <div class="row2">
      <label class="f">Type<select id="fType"></select></label>
      <label class="f">Date noticed<input type="date" id="fDate"></label>
    </div>
    <fieldset class="sev">
      <legend>Severity</legend>
      <div class="seg">
        <input type="radio" name="sev" id="s-minor" value="minor"><label for="s-minor" style="--c:var(--minor)">Minor</label>
        <input type="radio" name="sev" id="s-moderate" value="moderate"><label for="s-moderate" style="--c:var(--moderate)">Moderate</label>
        <input type="radio" name="sev" id="s-severe" value="severe"><label for="s-severe" style="--c:var(--severe)">Severe</label>
      </div>
    </fieldset>
    <label class="f">Description<textarea id="fNote" rows="3" placeholder="Size, depth, how it happened, other party involved"></textarea></label>
    <div class="row2">
      <label class="f">Noticed by<input id="fBy" autocomplete="off"></label>
      <label class="f">Status<select id="fStatus"><option value="open">Open</option><option value="repaired">Repaired</option></select></label>
    </div>
    <div class="photo-row">
      <span class="lbl">Photos</span>
      <div class="thumbs" id="fPhotos"></div>
      <label class="btn addphoto" id="addPhoto">Add photos<input type="file" id="fFile" accept="image/*" multiple></label>
      <p class="photo-note" id="photoNote" hidden></p>
    </div>
    <div class="actions">
      <button class="btn danger" id="fDelete">Delete</button>
      <span class="spacer"></span>
      <button class="btn" id="fCancel">Cancel</button>
      <button class="btn primary" id="fSave">Save damage</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden><img alt="Damage photo" id="lbImg"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
// Procedural van body with T6.1 short-wheelbase proportions (metres).
// X = length (front at +X), Y = up, Z = width (right side at +Z).
const VAN = { L: 4.904, W: 1.904, FA: 1.50, RA: -1.50, WR: 0.34, AR: 0.43, BEV: 0.05, YB: 0.36 };

function buildVan() {
  const { FA, RA, WR, AR, BEV, YB } = VAN;
  const HALF = 0.902;               // extrude half-depth (plus bevel = 0.952)
  const SIDE = HALF + BEV;          // flat side surface z
  const group = new THREE.Group();
  const pickables = [];

  const M = {
    paint: new THREE.MeshStandardMaterial({ color: 0xeef1f3, roughness: 0.38, metalness: 0.08 }),
    trim: new THREE.MeshStandardMaterial({ color: 0x2b3136, roughness: 0.85 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x1b2730, roughness: 0.12, metalness: 0.35, side: THREE.DoubleSide }),
    tyre: new THREE.MeshStandardMaterial({ color: 0x1a1c1e, roughness: 0.92 }),
    rim: new THREE.MeshStandardMaterial({ color: 0xb4bcc3, roughness: 0.35, metalness: 0.6 }),
    lamp: new THREE.MeshStandardMaterial({ color: 0xdfe7ee, roughness: 0.15, metalness: 0.2, emissive: 0x20262b }),
    tail: new THREE.MeshStandardMaterial({ color: 0xa81e28, roughness: 0.3, emissive: 0x2a0508 }),
    line: new THREE.LineBasicMaterial({ color: 0x86919a })
  };

  function add(mesh, part) {
    mesh.castShadow = true;
    mesh.userData.part = part;
    group.add(mesh);
    pickables.push(mesh);
    return mesh;
  }

  // Body side profile with wheel arches cut into the bottom edge
  const s = new THREE.Shape();
  const a = Math.asin((YB - WR) / AR);
  s.moveTo(-2.34, YB);
  [RA, FA].forEach(xc => {
    s.lineTo(xc - AR * Math.cos(a), YB);
    s.absarc(xc, WR, AR, Math.PI - a, a, true);
  });
  s.lineTo(2.36, YB);
  s.quadraticCurveTo(2.44, YB, 2.44, YB + 0.08);
  s.lineTo(2.44, 0.86);
  s.quadraticCurveTo(2.44, 0.98, 2.34, 1.01);
  s.lineTo(1.86, 1.12);
  s.lineTo(1.24, 1.86);
  s.quadraticCurveTo(1.16, 1.93, 1.02, 1.93);
  s.lineTo(-2.30, 1.93);
  s.quadraticCurveTo(-2.40, 1.93, -2.40, 1.83);
  s.lineTo(-2.40, YB + 0.06);
  s.quadraticCurveTo(-2.40, YB, -2.34, YB);

  const bodyGeo = new THREE.ExtrudeGeometry(s, {
    depth: HALF * 2, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV,
    bevelSegments: 4, curveSegments: 24
  });
  bodyGeo.translate(0, 0, -HALF);
  const body = add(new THREE.Mesh(bodyGeo, M.paint), 'body');
  body.receiveShadow = true;

  // Windscreen, placed on the sloped face
  const ws0 = new THREE.Vector2(1.86, 1.12), ws1 = new THREE.Vector2(1.24, 1.86);
  const slope = ws1.clone().sub(ws0);
  const slopeLen = slope.length();
  const n2 = new THREE.Vector2(-slope.y, slope.x).normalize().negate(); // outward (+x,+y)
  if (n2.x < 0) n2.negate();
  const mid = ws0.clone().add(ws1).multiplyScalar(0.5).add(n2.clone().multiplyScalar(BEV + 0.004));
  const wsMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.62, slopeLen * 0.86), M.glass);
  wsMesh.position.set(mid.x, mid.y, 0);
  wsMesh.rotation.set(0, Math.PI / 2, Math.atan2(n2.y, n2.x), 'ZYX');
  add(wsMesh, 'Windscreen');

  // Front door windows
  const dw = new THREE.Shape();
  dw.moveTo(0.99, 1.20); dw.lineTo(1.68, 1.20); dw.lineTo(1.17, 1.82); dw.lineTo(0.99, 1.82); dw.lineTo(0.99, 1.20);
  [1, -1].forEach(sd => {
    const m = new THREE.Mesh(new THREE.ShapeGeometry(dw), M.glass);
    m.position.z = sd * (SIDE + 0.003);
    add(m, 'sidewindow');
  });

  // Rear window in the tailgate
  const rw = new THREE.Mesh(new THREE.PlaneGeometry(1.44, 0.50), M.glass);
  rw.position.set(-2.40 - BEV - 0.003, 1.56, 0);
  rw.rotation.y = -Math.PI / 2;
  add(rw, 'Rear window');

  // Bumpers, grille, lights
  const box = (sx, sy, sz, mat, x, y, z, part) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    m.position.set(x, y, z);
    return add(m, part);
  };
  box(0.13, 0.30, 1.90, M.trim, 2.455, 0.50, 0, 'Front bumper');
  box(0.12, 0.24, 1.90, M.trim, -2.47, 0.48, 0, 'Rear bumper');
  box(0.02, 0.13, 1.00, M.trim, 2.492, 0.79, 0, 'Grille');
  [1, -1].forEach(sd => {
    box(0.03, 0.11, 0.30, M.lamp, 2.482, 0.84, sd * 0.72, 'headlight');
    box(0.03, 0.55, 0.10, M.tail, -2.452, 1.26, sd * 0.87, 'taillight');
    box(0.15, 0.21, 0.06, M.trim, 1.72, 1.32, sd * 1.05, 'mirror');
    box(0.08, 0.04, 0.12, M.trim, 1.74, 1.24, sd * 0.98, 'mirror');

function detectZone(obj, p, n) {
  const side = p.z > 0 ? 'Right' : 'Left';
  const part = obj.userData.part;
  const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
  if (part && part !== 'body') {
    switch (part) {
      case 'wheel': return `${p.x > 0 ? 'Front' : 'Rear'} ${lower(side)} wheel`;
      case 'mirror': return `${side} mirror`;
      case 'headlight': return `${side} headlight`;
      case 'taillight': return `${side} tail light`;
      case 'sidewindow': return `${side} door window`;
      case 'handle':
        if (p.x < -2) return 'Tailgate handle';
        return `${side} ${p.x > 0.9 ? 'front door' : 'sliding door'} handle`;
      default: return part;
    }
  }
  for (const xc of [VAN.FA, VAN.RA]) {
    const d = Math.hypot(p.x - xc, p.y - VAN.WR);
    if (d < VAN.AR + 0.06 && Math.abs(n.z) < 0.6 && p.y < 0.85) {
      return `${xc > 0 ? 'Front' : 'Rear'} ${lower(side)} wheel arch`;
    }
  }
  if (p.x > 1.8 && p.y > 0.9 && n.y > 0.3 && Math.abs(n.z) < 0.6) return 'Bonnet';
  if (n.y > 0.75 && p.y > 1.85) return 'Roof, ' + (p.x > 0.6 ? 'front' : p.x > -1.0 ? 'middle' : 'rear');
  if (n.x > 0.3 && n.y > 0.3 && p.y > 1.1 && Math.abs(n.z) < 0.6) return 'A-pillar / windscreen frame';
  if (Math.abs(n.z) > 0.6) {
    let panel;
    if (p.x > 1.84) panel = 'front wing';
    else if (p.x > 0.95) panel = 'front door';
    else if (p.x > -0.30) panel = side === 'Right' ? 'sliding door' : 'middle side panel';
    else if (p.x > -1.9) panel = 'rear side panel';
    else panel = 'rear quarter panel';
    if (p.y < 0.55) panel += ', lower edge';
    return `${side} ${panel}`;
  }
  if (n.x > 0.4) return 'Front, ' + (Math.abs(p.z) < 0.5 ? 'centre' : lower(side) + ' corner');
  if (n.x < -0.4) return (Math.abs(p.z) < 0.84 && p.y > 0.62) ? 'Tailgate' : `Rear, ${lower(side)} corner`;
  if (n.y < -0.3) return 'Underbody';
  return `${side} edge`;
}

        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));

        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);

        resolve(c.toDataURL('image/jpeg', mode === 'local' ? 0.75 : 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let modelDoc = null, loadedAsset = null, axles = { F: 1.60, R: -1.50, WR: 0.357 }, genericBody = false;

  if (!van.custom) return;

  van = schematic; scene.add(van.group);

function applyModel(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.set(root.position.x - c.x, root.position.y - box.min.y, root.position.z - c.z);
  root.updateMatrixWorld(true);
  const pick = [], wheel = { F: [], R: [] };
  genericBody = false;
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.side = THREE.DoubleSide; });
    const part = (o.parent && o.parent !== root && !o.parent.isScene) ? o.parent.name : o.name;
    o.userData.part = part || '';
    if (/^FrontDoor/.test(part || '')) genericBody = true;
    const wm = /^Wheel_([FR])/.exec(part || '');
    if (wm) wheel[wm[1]].push(new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()));
    pick.push(o);
  });
  if (wheel.F.length && wheel.R.length) {
    axles.F = wheel.F.reduce((s, v) => s + v.x, 0) / wheel.F.length;
    axles.R = wheel.R.reduce((s, v) => s + v.x, 0) / wheel.R.length;
    axles.WR = wheel.F.reduce((s, v) => s + v.y, 0) / wheel.F.length;
  }
  if (van.custom) { scene.remove(van.group); disposeGroup(van.group); } else scene.remove(van.group);
  van = { group: root, pickables: pick, custom: true };
  scene.add(root);
  scene.environment = envTex; hemi.intensity = 0.45;
  renderModelRow();
}
function parseGlb(buf) {
  return new Promise((res, rej) => new THREE.GLTFLoader().parse(buf, '', g => res(g.scene), rej));
}
function b64encode(ab) {
  const bytes = new Uint8Array(ab); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64decode(str) {
  const bin = atob(str.trim()); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
async function loadModelAsset(doc) {

}

function zoneCustom(obj, p, n) {
  const part = obj.userData.part || '';
  const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
  const mat = (mats[0] && mats[0].name) || '';
  const side = p.z > 0 ? 'Right' : 'Left', lside = side.toLowerCase();
  const fr = p.x > (axles.F + axles.R) / 2 ? 'Front' : 'Rear';
  const glass = mat === 'Glass';
  let m;
  if ((m = /^Wheel_([FR])/.exec(part))) return `${m[1] === 'F' ? 'Front' : 'Rear'} ${lside} wheel`;
  if (/^SlidingDoor/.test(part)) return `${side} sliding door${glass ? ' window' : p.y < 0.55 ? ', lower edge' : ''}`;
  if (/^RearDoor/.test(part)) return `${side} rear door${glass ? ' window' : ''}`;
  if (/^HandleSliding/.test(part)) return `${side} sliding door handle`;
  if (/^HandleFront/.test(part)) return `${side} front door handle`;
  if (/^TailLight/.test(part)) return `${side} tail light`;
  if (/^Glass_FrontDoor/.test(part)) return `${side} front door window`;
  if (/^(Seat|Steering|Interior)/.test(part)) return 'Interior';
  if (/^FrontDoor/.test(part)) return `${side} front door${glass ? ' window' : p.y < 0.55 ? ', lower edge' : ''}`;
  if (/^Mirror/.test(part)) return `${side} mirror`;
  if (/^Headlight/.test(part)) return `${side} headlight`;
  if (/^FrontWing/.test(part)) return `${side} front wing`;
  if (/^Bumper_Front/.test(part)) return Math.abs(p.z) > 0.7 ? `Front bumper, ${lside} corner` : 'Front bumper';
  if (/^Bumper_Rear/.test(part)) return Math.abs(p.z) > 0.7 ? `Rear bumper, ${lside} corner` : 'Rear bumper';
  if (/^Grille/.test(part)) return 'Grille';
  if (/^Bonnet/.test(part)) return 'Bonnet';
  if (/^Windscreen/.test(part)) return 'Windscreen';
  if (/^Underbody/.test(part)) return 'Underbody';
  if (/^Roof/.test(part)) return 'Roof, ' + (p.x > axles.F - 0.6 ? 'front' : p.x > axles.R + 0.4 ? 'middle' : 'rear');
  if ((m = /raw_?\.?0*(\d+)$/.exec(part))) {
    const k = +m[1];
    if (k === 5) return 'Grille badge';
    if ([17, 18, 20, 21].includes(k)) return 'Grille';
    if ([9, 10, 30, 31].includes(k)) return `${side} front indicator`;
    return `${side} headlight`;
  }
  if (glass) {
    if (n.x > 0.4) return 'Windscreen';
    if (n.x < -0.4) return 'Rear window';
    return p.x > 0.28 ? `${side} front door window` : `${side} rear side window`;
  }
  if (mat === 'Interior') return 'Interior';
  if (mat === 'Plastic_Dark') return p.x > 0 ? (Math.abs(p.z) > 0.7 ? `Front bumper, ${lside} corner` : 'Front bumper') : (Math.abs(p.z) > 0.7 ? `Rear bumper, ${lside} corner` : 'Rear bumper');
  for (const [ax, lab] of [[axles.F, 'Front'], [axles.R, 'Rear']]) {
    if (Math.hypot(p.x - ax, p.y - axles.WR) < 0.52 && p.y < 0.95) return `${lab} ${lside} wheel arch`;
  }
  if (mat === 'Plastic_Black') return 'Underbody';
  if (Math.abs(p.z) > 0.96 && p.y > 1.05 && p.x > 1.0) return `${side} mirror`;
  if (n.y > 0.75 && p.y > 1.9) return 'Roof, ' + (p.x > 0.8 ? 'front' : p.x > -1.0 ? 'middle' : 'rear');
  if (p.x > 1.35 && n.y > 0.35 && p.y > 0.85 && Math.abs(n.z) < 0.6) return 'Bonnet';
  if (n.x > 0.3 && n.y > 0.3 && p.y > 1.2 && Math.abs(n.z) < 0.6) return 'A-pillar / windscreen frame';
  if (Math.abs(n.z) > 0.6 && genericBody) {
    const pos = p.x > (axles.F + axles.R) / 2 ? 'front half' : p.x > axles.R + 0.5 ? 'middle' : 'rear';
    return `${side} side panel, ${pos}${p.y < 0.55 ? ', lower edge' : ''}`;
  }
  if (Math.abs(n.z) > 0.6) {
    let panel;
    if (p.x > 1.38) panel = 'front wing';
    else if (p.x > 0.28) panel = 'front door';
    else if (p.x > -1.0) panel = 'sliding door frame';
    else if (p.x > -1.95) panel = 'rear side panel';
    else panel = 'rear quarter panel';
    if (p.y < 0.55) panel += ', lower edge';
    return `${side} ${panel}`;
  }
  if (n.x > 0.4) return 'Front, ' + (Math.abs(p.z) < 0.5 ? 'centre' : lside + ' corner');
  if (n.x < -0.4) return `Rear, ${Math.abs(p.z) < 0.5 ? 'centre' : lside + ' corner'}`;
  if (n.y < -0.3) return 'Underbody';
  return `${side} ${fr.toLowerCase()} edge`;
}

function writeFailed(err) {
  if (err && err.code === 'invalid_argument') { readOnly = true; renderVehicle(); renderList(); toast('You have view access only, so changes can’t be saved.'); }
  else if (err && err.code === 'quota_exceeded') toast('Storage is full. Delete old entries to add more.');
  else toast('Saving failed. Check your connection and try again.');
}
async function withRetry(fn) {

    throw e;

}
async function saveDamage(d) {

    renderAll();
    try { await withRetry(() => db.collection('damages').doc(id).set(body)); return true; }
    catch (e) { damages = prev; renderAll(); writeFailed(e); return false; }
  }
  damages = damages.filter(x => x.id !== d.id).concat([d]);
  lsSet('vanlog:damages', damages);
  return true;
}
async function removeDamage(id) {
  const prev = damages.slice();

  renderAll();
  if (mode === 'db') {
    try { await withRetry(() => db.collection('damages').doc(id).delete()); toast('Damage deleted.'); }
    catch (e) { damages = prev; renderAll(); writeFailed(e); }

async function saveFile(filename, data, mime) {

    catch (e) {
      if (e && e.code === 'declined') return;
      toast(e && e.code === 'rate_limited' ? 'A download prompt is already open.' : 'The download could not start.');

  const a = document.createElement('a');

  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  renderer.setPixelRatio(1);

  const bg = document.documentElement.matches(':root[data-theme="dark"]') ? 0x161f26 : 0xf3f5f7;

${list.length ? '<h2>Details</h2>' : ''}
${list.map(d => `<div class="d"><h3>${d.n}. ${esc(d.zone)}</h3><p>${esc(d.type)}, ${esc(SEV[d.severity])}, ${d.status === 'repaired' ? 'repaired' : 'open'}. Noticed ${esc(fmtDate(d.date))}${d.by ? ' by ' + esc(d.by) : ''}.</p>${d.note ? `<p>${esc(d.note)}</p>` : ''}${photoMap[d.id].length ? `<div class="ph">${photoMap[d.id].map((u, i) => `<img src="${u}" alt="Photo ${i + 1} of damage ${d.n}">`).join('')}</div>` : ''}</div>`).join('')}
<p class="small">3D views are a schematic of the vehicle. Marker positions show the approximate location of each damage.</p>
</body></html>`;
    await saveFile(fileBase() + '.html', html, 'text/html');
  } catch (e) {
    toast('The report could not be created.');
  } finally {
    btn.disabled = false; btn.textContent = 'Download report';
  }
});
})();

</script>
</body>
</html>
